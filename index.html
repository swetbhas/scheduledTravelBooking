## BP-1 Required Search Inputs
The agent must have origin airport, destination airport, departure date, return date, number of travelers, budget, and approval status before preparing any simulated booking action.

## BP-2 Ranking Priorities
Rank eligible flights in this order: within budget, preferred departure window, maximum stops, baggage included, then shortest duration.

## BP-3 Book Now Criteria
The agent may recommend Book Now only when at least one available flight is within budget, meets the maximum stop limit, includes required baggage, and has verified data quality.

## BP-4 Best Partial Match Criteria
If no flight satisfies every traveler preference but at least one flight is still usable, the agent may recommend Best Partial Match. It must name the unmet criteria and wait for the traveler decision.

The agent must not complete even a simulated booking until the human approves the recommendation. Payment, passport details, and real booking systems are always out of scope.`,

The prototype may use only fake traveler names, fake contact information, simulated fare records, and demo identifiers. It must not use real personal, payment, passport, loyalty, or booking data.

If required traveler information is missing or flight data is inconsistent, the agent must stop and escalate instead of inventing a value.

The agent must not send real alerts, process payment, alter traveler preferences, or book travel. Email, SMS, and booking actions are simulated on screen only.

    const API_KEY_STORAGE_KEY = "flight_monitor_anthropic_api_key";

    function parseCsv(csvText) {
      const rows = [];
      let row = [];
      let value = "";
      let inQuotes = false;

      for (let index = 0; index < csvText.length; index += 1) {
        const char = csvText[index];
        const next = csvText[index + 1];

        if (char === '"' && inQuotes && next === '"') {
          value += '"';
          index += 1;
        } else if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === "," && !inQuotes) {
          row.push(value);
          value = "";
        } else if ((char === "\n" || char === "\r") && !inQuotes) {
          if (char === "\r" && next === "\n") {
            index += 1;
          }
          row.push(value);
          if (row.some((cell) => cell !== "")) {
            rows.push(row);
          }
          row = [];
          value = "";
        } else {
          value += char;
        }
      }

      row.push(value);
      if (row.some((cell) => cell !== "")) {
        rows.push(row);
      }

      const headers = rows.shift();
      return rows.map((cells) => Object.fromEntries(headers.map((header, index) => [header, cells[index] ?? ""])));
    }

    const DATA = {
      monitoringCases: parseCsv(MONITORING_CASES_CSV),
      travelerProfiles: parseCsv(TRAVELER_PROFILES_CSV),
      flightSnapshots: parseCsv(FLIGHT_SNAPSHOTS_CSV),
      alertHistory: parseCsv(ALERT_HISTORY_CSV),
      evalCases: parseCsv(EVAL_CASES_CSV)
    };

    function byId(records, fieldName) {
      return records.reduce((index, record) => {
        index[record[fieldName]] = record;
        return index;
      }, {});
    }

    function text(value) {
      return value || "missing";
    }

    function setupSettingsPanel() {
      const input = document.getElementById("api-key-input");
      const status = document.getElementById("api-key-status");

      function renderKeyStatus() {
        const savedKey = localStorage.getItem(API_KEY_STORAGE_KEY);
        status.textContent = savedKey ? "key saved" : "no key saved";
      }

      input.addEventListener("input", () => {
        const key = input.value.trim();
        if (key) {
          localStorage.setItem(API_KEY_STORAGE_KEY, key);
        } else {
          localStorage.removeItem(API_KEY_STORAGE_KEY);
        }
        renderKeyStatus();
      });

      renderKeyStatus();
    }

      const summaryItems = [

        `${DATA.travelerProfiles.length} traveler profile`,
        `${DATA.flightSnapshots.length} flight snapshots`,
        `${DATA.alertHistory.length} alert history records`,
        `${DATA.evalCases.length} eval cases`,
        `${Object.keys(POLICY_FILES).length} policy files`
      ];
      document.getElementById("summary").innerHTML = summaryItems.map((item) => `<li>${item}</li>`).join("");
    }

    function renderPolicies() {
      const policyList = document.getElementById("policy-list");
      policyList.innerHTML = Object.entries(POLICY_FILES).map(([fileName, content]) => {
        const sections = (content.match(/^## /gm) || []).length;
        return `<li><strong>${fileName}</strong>: ${sections} citable sections</li>`;
      }).join("");
    }

    function renderCases() {
      const travelersById = byId(DATA.travelerProfiles, "traveler_id");
      const evalsByCaseId = byId(DATA.evalCases, "case_id");
      const caseList = document.getElementById("case-list");

      caseList.innerHTML = DATA.monitoringCases.map((caseRecord) => {
        const traveler = travelersById[caseRecord.traveler_id];
        const flights = DATA.flightSnapshots.filter((flight) => flight.case_id === caseRecord.case_id);
        const alerts = DATA.alertHistory.filter((alert) => alert.case_id === caseRecord.case_id);
        const evalCase = evalsByCaseId[caseRecord.case_id];

        return `
          <article>
            <h3>${caseRecord.case_id}: ${caseRecord.case_name}</h3>
            <p><strong>Trigger:</strong> ${caseRecord.trigger_text}</p>
            <p><strong>Trip:</strong> ${text(caseRecord.origin)} to ${text(caseRecord.destination)}, ${text(caseRecord.depart_date)} to ${text(caseRecord.return_date)}, ${caseRecord.adults} adult, budget $${caseRecord.max_budget_usd}</p>
            <p><strong>Traveler:</strong> ${traveler ? `${traveler.name} (${traveler.traveler_id}), ${traveler.email}, home airport ${traveler.home_airport}` : "No linked traveler found"}</p>
            <p><strong>Scenario:</strong> ${caseRecord.scenario_type}; required info complete: ${caseRecord.required_info_complete}; approval state: ${caseRecord.approval_state}</p>
            <p><strong>Notes:</strong> ${caseRecord.notes}</p>

            <details>
              <summary>Linked flight snapshots (${flights.length})</summary>
              <ul>
                ${flights.map((flight) => `
                  <li>${flight.snapshot_id} / ${flight.flight_id}: ${flight.airline}, $${flight.price_usd}, ${flight.stops} stop(s), baggage ${flight.baggage_included}, ${flight.availability_status}, data ${flight.data_quality}</li>
                `).join("")}
              </ul>
            </details>

            <details>
              <summary>Linked alert history (${alerts.length})</summary>
              ${alerts.length ? `
                <ul>
                  ${alerts.map((alert) => `<li>${alert.alert_id}: ${alert.recommendation}, ${alert.status}, response ${alert.human_response}. ${alert.notes}</li>`).join("")}
                </ul>
              ` : "<p>No prior alerts for this case.</p>"}
            </details>

            <details>
              <summary>Eval link</summary>
              ${evalCase ? `
                <p><strong>${evalCase.eval_id}: ${evalCase.case_name}</strong></p>
                <p>${evalCase.expected_behavior}</p>
              ` : "<p>This case is additional demo data, not one of the five eval rows.</p>"}
            </details>
          </article>
        `;
      }).join("");
    }

    setupSettingsPanel();
    renderSummary();
    renderPolicies();
    renderCases();
  </script>
</body>
</html>
